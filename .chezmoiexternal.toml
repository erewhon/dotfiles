[".local/share/zinit/zinit.git"]
    type = "archive"
    url = "https://github.com/zdharma-continuum/zinit/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
[".local/share/fastfetch/backgrounds"]
    type = "archive"
    url = "https://github.com/erewhon/dotfiles-assets/releases/download/v1/fastfetch-backgrounds.tar.gz"
    exact = true
    refreshPeriod = "720h"
[".config/tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/master.tar.gz"
    exact = true
    stripComponents = 1
[".config/tmux/plugins/catppuccin/tmux"]
    type = "archive"
    url = "https://github.com/catppuccin/tmux/archive/v2.1.3.tar.gz"
    exact = true
    stripComponents = 1

# mdview: the read-only markdown viewer (NVIM_APPNAME=mdview, `md` alias).
# Uses neovim's native pack/ loader rather than a plugin manager, so the two
# plugins it needs are pinned here. Version-pinned URLs, so no refreshPeriod:
# these only move when the pin below changes.
[".config/mdview/pack/plugins/start/catppuccin"]
    type = "archive"
    url = "https://github.com/catppuccin/nvim/archive/79e2049a0fdf7ec840f8463fe1d962c94493196b.tar.gz"
    exact = true
    stripComponents = 1
[".config/mdview/pack/plugins/start/render-markdown.nvim"]
    type = "archive"
    url = "https://github.com/MeanderingProgrammer/render-markdown.nvim/archive/v8.13.0.tar.gz"
    exact = true
    stripComponents = 1
