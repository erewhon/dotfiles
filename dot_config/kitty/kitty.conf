# Kitty config. Values mirror the Konsole "Erewhon" profile.

# Font
font_family JetBrainsMono Nerd Font Mono
font_size 12

# Transparency and blur.
# Blur strength is set in KDE: System Settings > Desktop Effects > Blur.
# The value here only switches it on.
background_opacity 0.8
background_blur 1

# Colours
include breeze.conf
