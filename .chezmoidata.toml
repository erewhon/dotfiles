# Host classification catalog for chezmoi templates.
# Unknown hosts fall back to [host_defaults] (remote, non-personal). Either
# layer can be overridden per machine by [data.host_overrides] in
# ~/.config/chezmoi/chezmoi.toml, which `chezmoi init` writes from
# .chezmoi.toml.tmpl (`chezmoi init --promptBool home=true`, or `bootstrap --home`).
#
# Usage in templates (never index .hosts directly):
#   {{ $host := includeTemplate "host-profile" . | fromJson }}
#   {{ if $host.has_brew }}...{{ end }}

[host_defaults]
is_remote = true
has_gui = true
has_brew = true
has_apt = false
has_dnf = false
is_personal = false

